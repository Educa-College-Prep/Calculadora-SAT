name: Actualizar datos

# Cada lunes revisa si College Scorecard o IPEDS publicaron datos nuevos. Si los hay, abre
# un PR con universidades.json y fuentes_datos.json actualizados; al mergearlo, se publica.
# Si no hay nada nuevo, termina sin hacer cambios.
on:
  schedule:
    - cron: '0 13 * * 1'   # lunes 8:00 de Lima
  workflow_dispatch:        # botón "Run workflow" para revisar a mano

permissions:
  contents: write
  pull-requests: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calculadora-sat
    steps:
      - uses: actions/checkout@v4

      # Solo usa la biblioteca estándar de Python, que ya viene en la máquina.
      - run: python3 scripts/actualizar_datos.py

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: datos-automaticos
          delete-branch: true
          add-paths: |
            calculadora-sat/public/universidades.json
            calculadora-sat/public/fuentes_datos.json
          commit-message: 'datos: actualización automática de College Scorecard e IPEDS'
          title: 'Datos nuevos de College Scorecard / IPEDS'
          body: |
            El robot semanal encontró datos nuevos publicados por el gobierno de EE.UU.
            y regeneró `universidades.json` y `fuentes_datos.json`.

            Antes de mergear, revisa la vista previa: que la cantidad de universidades sea
            parecida y que las fichas se vean bien. Las fuentes y años nuevos están en
            `fuentes_datos.json`.
